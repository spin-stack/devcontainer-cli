name: Set up parity runtime
description: >-
  Shared setup for the Docker-backed parity jobs: Go/pnpm/Node toolchain, the CI
  runner prep (free disk + containerd image store), and the compiled TypeScript
  reference oracle. Used by both the scoped push/PR shard job and the daily full
  shard job so their environments stay byte-for-byte identical.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
    # pnpm installs the reference, through the firewall (task reference).
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11.27.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "24"
    # Free disk + enable the containerd image store (build-cache export). Reuses
    # the Taskfile so the runner prep is identical to release.yml.
    - run: go tool task ci:prepare-runner
      shell: bash
    # The TS reference builds a compose service from a Dockerfile it writes under
    # /tmp, outside the build context. Compose builds through bake, and bake on
    # buildx 0.38 (GitHub's runner image, 2026-10-24) refuses to read a file
    # outside the context unless the caller passes --allow=fs.read, which the
    # reference never does: every compose case failed with "additional
    # privileges requested". The Go CLI passes the entitlement itself. Off for
    # the whole job, so both sides build the same way.
    - run: echo "BUILDX_BAKE_ENTITLEMENTS_FS=0" >> "$GITHUB_ENV"
      shell: bash
    - run: go tool task reference
      shell: bash
